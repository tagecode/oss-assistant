name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Verify
        uses: ./.github/actions/verify
