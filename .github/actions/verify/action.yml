name: Verify
description: Lint, typecheck, unit/component tests, and production build

runs:
  using: composite
  steps:
    - name: Lint
      shell: bash
      run: pnpm lint

    - name: Typecheck
      shell: bash
      run: pnpm typecheck

    - name: Unit & component tests
      shell: bash
      run: pnpm test

    - name: Production build
      shell: bash
      run: pnpm build
