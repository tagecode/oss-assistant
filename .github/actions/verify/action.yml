name: Verify
description: Typecheck, unit/component tests, production build, and E2E (mock cloud)

runs:
  using: composite
  steps:
    - name: Typecheck
      shell: bash
      run: pnpm typecheck

    - name: Unit & component tests
      shell: bash
      run: pnpm test

    - name: Production build
      shell: bash
      run: pnpm build

    - name: Install Playwright dependencies
      shell: bash
      run: pnpm exec playwright install --with-deps

    - name: E2E (mock cloud)
      shell: bash
      run: pnpm test:e2e
      env:
        E2E_MOCK_CLOUD: '1'
