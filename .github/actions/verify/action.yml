name: Verify
description: Lint, typecheck, unit/component tests, production build, and E2E tests

runs:
  using: composite
  steps:
    - name: Lint
      shell: bash
      run: pnpm lint

    - name: Typecheck
      shell: bash
      run: pnpm typecheck

    - name: Unit & component tests
      shell: bash
      run: pnpm test

    - name: Production build
      shell: bash
      run: pnpm build

    # Electron 在 Linux 上需要一组系统库；用 Playwright 自带的依赖列表，
    # 避免手写一份容易和 runner 镜像漂移的包名清单。
    - name: Install Playwright system dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: pnpm exec playwright install-deps chromium

    # install-deps 不保证带上 xvfb；显式装一次（已安装时 apt 直接成功返回）。
    # Xvfb 本身没有窗口管理器，Electron 的 maximize/minimize 不会真正生效，
    # 自绘标题栏用例需要 openbox 提供 EWMH 窗口状态管理。
    - name: Install xvfb and openbox
      if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get install -y xvfb openbox

    - name: E2E tests
      shell: bash
      run: bash scripts/ci-run-e2e.sh

    - name: Upload E2E report
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: e2e-report
        path: |
          test-results/
          playwright-report/
        if-no-files-found: ignore
        retention-days: 7
