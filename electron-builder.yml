appId: com.tagecode.oss-assistant
productName: OSS 助手
copyright: "Copyright © 2026 TageCode"
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
win:
  executableName: oss-assistant
nsis:
  artifactName: ${name}-v${version}-${os}-${arch}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName} v${version}
  createDesktopShortcut: always
  oneClick: false
  allowToChangeInstallationDirectory: true
  createStartMenuShortcut: true
mac:
  artifactName: ${name}-v${version}-${os}-${arch}.${ext}
  target:
    - dmg
    - zip
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-v${version}-${os}-${arch}.${ext}
linux:
  target:
    - AppImage
    - deb
  maintainer: tagecode@hotmail.com
  category: Utility
appImage:
  artifactName: ${name}-v${version}-${os}-${arch}.${ext}
deb:
  artifactName: ${name}-v${version}-${os}-${arch}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: tagecode
  repo: oss-assistant
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
